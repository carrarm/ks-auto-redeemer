name: Daily redeem

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *' # UTC hour

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Debug schedule
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled at: ${{ github.event.schedule }}"
          date -u
          date

      - name: Start redeem
        run: |
          npm ci
          node ks-redeemer.js --alliances=FRA,emr --kid=2363 --ignored-codes=VIP777,Kingshot888
