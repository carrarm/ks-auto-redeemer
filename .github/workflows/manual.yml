name: Daily redeem

on:
  schedule:
    - cron: '0 4 * * *' # 8h en France en heure d'été
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node ks-redeemer.js
